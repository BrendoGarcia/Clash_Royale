name: Deploy Clash Royale App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout application
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate application
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          CLASH_ROYALE_API_KEY: ${{ secrets.CLASH_ROYALE_API_KEY }}
        run: python -m py_compile clash.py

      - name: Authenticate Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Prepare App Engine configuration
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          CLASH_ROYALE_API_KEY: ${{ secrets.CLASH_ROYALE_API_KEY }}
        run: |
          cat > app.yaml <<EOF
          runtime: python311
          entrypoint: gunicorn --bind :\$PORT clash:app

          env_variables:
            FLASK_ENV: production
            MONGODB_URI: "$MONGODB_URI"
            CLASH_ROYALE_API_KEY: "$CLASH_ROYALE_API_KEY"

          handlers:
            - url: /.*
              script: auto
          EOF

      - name: Deploy the actual Flask application
        run: gcloud app deploy app.yaml --quiet

      - name: Show deployed application URL
        run: |
          echo "Application deployed:"
          gcloud app browse --no-launch-browser
